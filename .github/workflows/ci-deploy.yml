name: Cobalto CI and deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - working-directory: cobalto_app
        run: flutter pub get
      - working-directory: cobalto_app
        run: flutter analyze
      - working-directory: cobalto_app
        run: flutter test
      - working-directory: cobalto_app
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.invalid.example/api

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - working-directory: backend
        run: mvn --batch-mode verify

  deploy_api:
    if: ${{ false }}
    needs: [flutter, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and publish API image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/cobalto-api:${GITHUB_SHA}"
          docker build --tag "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy API to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          MIGRATOR_SERVICE_ACCOUNT: ${{ vars.GCP_MIGRATOR_SERVICE_ACCOUNT }}
          CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
          DB_USERNAME: ${{ vars.GCP_DB_USERNAME }}
          WEB_ORIGIN: ${{ vars.COBALTO_WEB_ORIGIN }}
        run: |
          gcloud run jobs deploy cobalto-db-migrate \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$MIGRATOR_SERVICE_ACCOUNT" \
            --tasks 1 \
            --max-retries 1 \
            --task-timeout 600s \
            --set-env-vars "^@^SPRING_PROFILES_ACTIVE=cloud,migrate@CLOUD_SQL_INSTANCE=${CLOUD_SQL_INSTANCE}@SPRING_DATASOURCE_DATABASE=cobalto@SPRING_DATASOURCE_USERNAME=cobalto_migrator" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=cobalto-migration-db-password:latest"
          gcloud run jobs execute cobalto-db-migrate \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait
          gcloud run deploy cobalto-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --min 1 \
            --max 3 \
            --cpu 1 \
            --memory 1Gi \
            --port 8080 \
            --timeout 30s \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,CLOUD_SQL_INSTANCE=${CLOUD_SQL_INSTANCE},SPRING_DATASOURCE_DATABASE=cobalto,SPRING_DATASOURCE_USERNAME=${DB_USERNAME},COBALTO_CORS_ALLOWED_ORIGINS=${WEB_ORIGIN}" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=cobalto-app-db-password:latest,COBALTO_JWT_SECRET=cobalto-jwt-secret:latest,COBALTO_MFA_ENCRYPTION_KEYS=cobalto-mfa-encryption-keys:latest"

  deploy_web:
    if: ${{ false }}
    needs: [flutter, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - working-directory: cobalto_app
        run: flutter pub get
      - working-directory: cobalto_app
        env:
          API_BASE_URL: ${{ vars.COBALTO_API_BASE_URL }}
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: cobalto_app/build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
