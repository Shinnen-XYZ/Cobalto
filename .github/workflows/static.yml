```yaml
name: Deploy Cobalto Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - 'cobalto_app/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: cobalto_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: cobalto_app
        run: flutter build web --release --base-href /Cobalto/ --dart-define=API_BASE_URL=https://cobalto-api.onrender.com/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cobalto_app/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
