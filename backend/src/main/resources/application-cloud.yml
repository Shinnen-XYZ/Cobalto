spring:
  datasource:
    url: "jdbc:postgresql:///${SPRING_DATASOURCE_DATABASE:cobalto}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlRefreshStrategy=lazy"
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: false
server:
  port: ${PORT:8080}
cobalto:
  cors:
    allowed-origins: ${COBALTO_CORS_ALLOWED_ORIGINS}
