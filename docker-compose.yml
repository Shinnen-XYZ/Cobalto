services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cobalto
      POSTGRES_USER: cobalto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cobalto_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cobalto-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobalto -d cobalto"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cobalto
      SPRING_DATASOURCE_USERNAME: cobalto
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cobalto_dev_only}
      COBALTO_JWT_SECRET: ${COBALTO_JWT_SECRET:-c2FuZGJveC1vbmx5LWNoYW5nZS10aGlzLXNlY3JldC1iZWZvcmUtcHJvZHVjdGlvbi0xMjM0NQ==}
      COBALTO_MFA_ENCRYPTION_KEYS: ${COBALTO_MFA_ENCRYPTION_KEYS:?Set a separate Base64 MFA encryption key}
      COBALTO_CORS_ALLOWED_ORIGINS: ${COBALTO_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cobalto-postgres:
